// Builds one icon inside `host` and returns its live instance.
function mountIcon(icon, i, host) {

function targetOf(inst) {

  const p = inst.cur;
  inst.icon.draw(p, inst.E, inst);
  for (const [el, shape] of inst.clips) {
    const d = el.getAttribute('d');
    if (d && shape.getAttribute('d') !== d) shape.setAttribute('d', d);
  }
  const deep = Boolean(runtime.palette.deepMarks);
  const key = hex(p.c) + hex(p.e) + deep;
  if (inst.painted === key) return;

  // edge colour, which stays strong when the fill is lifted.
  const pick = (src) => (rgb(src)[0] <= REF[0] ? p.e : p.c);

  for (const el of inst.whites) el.setAttribute(el.dataset.w, deep ? tint('#2F6FE0', p.e) : '#fff');

  };

/* Site UI; icon geometry and animation remain in the original vendor files. */
const library = window.LIBRARY;
const items = library.icons;
const categories = [...new Set(items.map(x=>x.category))];
const main = document.querySelector('main');
const search = document.querySelector('#search');
let category = '全部', query = '', serial = 0, instances = [];
const escapeHTML = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e = escapeHTML;
runtime.palette = {colors:new Proxy([], {get:()=>library.accent})};
document.documentElement.style.setProperty('--accent', library.accent);
document.querySelector('#total').textContent = `${items.length} icons`;
function mount(name,host,state=false,bindTo=null){
 const icon=ICONS.find(x=>x.name===name); if(!icon){host.textContent='图标定义缺失';return null;}
 const inst=mountIcon(icon,++serial,host);instances.push(inst);
 inst.hover=state?1:0;inst.cur=targetOf(inst);render(inst);
 if(bindTo){
  const set=h=>{inst.hover=h?1:0;go(inst);};
  bindTo.addEventListener('pointerenter',ev=>{if(ev.pointerType==='mouse')set(true)});
  bindTo.addEventListener('pointerleave',ev=>{if(ev.pointerType==='mouse')set(false)});
  bindTo.addEventListener('focus',()=>set(true));bindTo.addEventListener('blur',()=>set(false));
 }
 return inst;
}
function dispose(){instances.forEach(x=>cancelAnimationFrame(x.raf));instances=[];}
function tile(x){return `<a class="tile" href="#/icon/${x.name}" aria-label="${e(x.title)}，查看详情"><div class="tile-visual"><span class="ic" data-icon="${x.name}"></span></div><div class="tile-label"><strong>${e(x.title)}</strong><small>${x.name}</small></div></a>`;}
function mountTiles(){main.querySelectorAll('[data-icon]').forEach(host=>mount(host.dataset.icon,host,false,host.closest('a')));}
function filtered(){const words=query.trim().toLowerCase().split(/\s+/).filter(Boolean);return items.filter(x=>(category==='全部'||x.category===category)&&words.every(w=>[x.name,x.title,x.category,x.object,x.description].join(' ').toLowerCase().includes(w)));}
function gallery(){
 const found=filtered();
 main.innerHTML=`<div class="intro"><div><div class="eyebrow">THE ENERGY COLLECTION / 01</div><h1>电力，具象可见。</h1><p>为能源场景准备的 ${items.length} 枚物件图标。悬停播放，点击取用。</p></div><div class="spec"><span class="dot"></span>ONE ACCENT. PHYSICAL MOTION.<br>24 / 28 PX &nbsp; · &nbsp; SVG &nbsp; · &nbsp; 460 MS</div></div><div class="layout"><aside><div class="filter-title">按场景浏览</div><div class="filters" aria-label="图标分类">${['全部',...categories].map(c=>`<button data-category="${c}" aria-pressed="${c===category}">${c}<small>${c==='全部'?items.length:items.filter(x=>x.category===c).length}</small></button>`).join('')}</div><p class="aside-note">单一物件 · 真实动作<br>主色 <span style="color:var(--active)">${library.accent}</span><br><br>先确认语义，再选用图标。<br><a href="#/docs/scope">查看词条范围 ↗</a></p></aside><section aria-label="图标列表"><div class="result-bar" aria-live="polite"><span><strong>${e(category)}</strong> <span> / ${found.length} 枚图标${query?' · “'+e(query)+'”':''}</span></span><span>悬停预览 ↗</span></div>${found.length?`<div class="grid">${found.map(tile).join('')}</div>`:`<div class="empty"><h2>没有找到图标</h2><p>试试其他关键词，或清除当前筛选。</p><button id="reset">清除筛选</button></div>`}</section></div>`;
 main.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;dispose();gallery();});
 main.querySelector('#reset')?.addEventListener('click',()=>{category='全部';query='';search.value='';dispose();gallery();});mountTiles();
}
function sample(x,size){return `<span>${x.svg.rest.replaceAll('ki-',`sample${size}-ki-`).replace('<svg ',`<svg style="width:${size}px;height:${size}px" aria-hidden="true" `)}${size}px</span>`;}
function detail(name){
 const x=items.find(x=>x.name===name);if(!x){main.innerHTML='<h1>未找到这个图标</h1><a href="#/">返回全部图标 →</a>';return;}
 main.innerHTML=`<a class="back" href="#/">← 返回图标库</a><div class="detail-head"><span class="eyebrow">${e(x.category)}</span><span class="badge">SVG / 460 MS</span></div><h1 class="detail-title">${e(x.title)}</h1><div class="slug">${x.name}</div><div class="detail-layout"><div><div class="stages"><div class="stage"><span class="ic" id="rest"></span><small>01 / REST 静止态</small></div><div class="stage"><span class="ic" id="hover"></span><small>02 / HOVER 结束态</small></div></div><div class="live-row"><span class="ic" id="live"></span><p>动作预览<br>${e(x.action)}</p><button id="play" aria-pressed="false">播放动效</button></div></div><div class="detail-info"><h2>语义范围</h2><p>${e(x.description)}</p><dl><dt>所选物件</dt><dd>${e(x.object)}</dd><dt>分类</dt><dd>${e(x.category)}</dd><dt>推荐尺寸</dt><dd><div class="sample-sizes">${sample(x,24)}${sample(x,28)}</div></dd><dt>动态规则</dt><dd>460ms · 悬停到终点，移开回静止</dd></dl><div class="actions"><button class="copy" data-copy="rest">复制静止 SVG</button><button data-copy="hover">复制 Hover SVG</button><a href="data:image/svg+xml;charset=utf-8,${encodeURIComponent(x.svg.rest)}" download="${x.name}.svg">下载 SVG ↓</a></div><p style="font-size:12px">复制的是自带渐变、描边和滤镜的独立 SVG；静态 SVG 不含交互脚本。需要动效请使用接入包。</p><a href="#/docs">查看接入文档 ↗</a></div></div><div class="related"><h2>同类图标</h2><div class="grid">${items.filter(y=>y.category===x.category&&y!==x).map(tile).join('')||'<p class="muted">此分类目前仅有这枚图标。</p>'}</div></div>`;
 mount(name,document.querySelector('#rest'));mount(name,document.querySelector('#hover'),true);
 const live=mount(name,document.querySelector('#live'));
 document.querySelector('#play').onclick=ev=>{live.pin=!live.pin;go(live);ev.currentTarget.setAttribute('aria-pressed',String(live.pin));ev.currentTarget.textContent=live.pin?'回到静止':'播放动效';};
 main.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copySVG(x.svg[b.dataset.copy],b));mountTiles();
}
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',3000);}
async function copySVG(svg,button){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(svg);}else throw Error('fallback');toast('SVG 已复制到剪贴板');button.textContent='已复制 ✓';setTimeout(()=>button.textContent=button.dataset.copy==='rest'?'复制静止 SVG':'复制 Hover SVG',1800);}
 catch(_){const t=document.createElement('textarea');t.value=svg;t.setAttribute('aria-label','SVG 源码');t.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:.01';document.body.append(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}t.remove();if(ok){toast('SVG 已复制到剪贴板');button.textContent='已复制 ✓';}else{const old=main.querySelector('.manual-copy');old?.remove();const manual=document.createElement('textarea');manual.className='manual-copy';manual.value=svg;manual.setAttribute('aria-label','浏览器限制剪贴板，请手动复制 SVG');button.parentElement.after(manual);manual.focus();manual.select();toast('浏览器限制剪贴板，请按 Ctrl/Cmd+C 复制所选源码');}}
}
function docs(){
 main.innerHTML=`<article class="docs"><a class="back" href="#/">← 返回图标库</a><div class="eyebrow">DOCUMENTATION / V2</div><h1>从选用到接入。</h1><p class="doc-lead">同一套 SVG，适配静态页面、React 和 Vue。先确认图标表达的范围，再放入业务界面。</p><div class="doc-links"><a href="#/docs/static">纯静态 SVG</a><a href="#/docs/framework">React / Vue</a><a href="#/docs/color">主色</a><a href="#/docs/naming">命名与扩展</a><a href="#/docs/scope">语义边界</a></div><p class="muted">这是独立单文件版，全部 19 枚图标的两态 SVG 与引擎已内置。React / Vue 接入包与原始完整包沿用此前单独交付的附件，未嵌入本页。</p>
<section id="static"><h2>01 / 纯静态 SVG</h2><p>从详情复制 SVG 内联到 HTML，或点击详情中的“下载 SVG”，将文件放入自己的项目目录再引用。rest 为静止态，hover 为结束态，两者都是独立静态切图。推荐使用 24 或 28 CSS px。</p><pre class="code">&lt;img src="assets/svg/rest/smart-meter.svg"
     width="28" height="28" alt="智能电表"&gt;</pre><p>本站使用原始引擎播放 460ms 动效，无后端、无 CDN、无运行时网络依赖；双击 index.html 即可浏览。触屏可在详情点“播放动效”，键盘聚焦图标也会播放。遵循系统“减少动态效果”偏好。</p></section>
<section id="framework"><h2>02 / React 与 Vue</h2><p>先解压此前交付的原始图标完整包与 React / Vue 接入包。在接入包根目录运行 Node 18+ 命令，参数指向完整图标包：</p><pre class="code">node scripts/prepare-runtime.mjs ../energy-icons-v2-complete</pre><p>把生成后的整个 src/ 放到项目的 src/components/energy-icons/。组件只依赖项目已有 React 18+ 或 Vue 3.3+。</p><h3>React / TSX</h3><pre class="code">import { EnergyIcon } from './components/energy-icons';
export function MeterEntry() {
  return &lt;EnergyIcon name="meter-box" size={28}
    color="#2374D9" aria-label="表箱" /&gt;;
}</pre><h3>Vue 3</h3><pre class="code">&lt;script setup lang="ts"&gt;
import EnergyIcon from './components/energy-icons/EnergyIcon.vue';
&lt;/script&gt;
&lt;template&gt;
  &lt;EnergyIcon name="branch-box" :size="28"
    color="#2374D9" aria-label="分支箱" /&gt;
&lt;/template&gt;</pre><p>放进按钮时传 tabIndex={-1} / :tabindex="-1"，让外层入口承担焦点。组件负责生命周期清理；触屏点按切换两态。SSR 首屏预留空间，挂载后才显示 SVG；需要服务端首屏图形时用静止 SVG。</p><a href="data:text/plain;base64,IyBSZWFjdCAvIFZ1ZSDliqjmlYjlm77moIfmjqXlhaUKCuacrOWMheWPquihpeaOpeWFpeS7o+egge+8jOS4jemHjeWkjeWIhuWPkeW3suacieeahCAxOSDmnprlm77moIfjgILor7flhYjkv53nlZkgYGVuZXJneS1pY29ucy12Mi1jb21wbGV0ZS56aXBgIOW5tuino+WOi+OAgue7hOS7tuayoeacieesrOS4ieaWueWKqOeUu+S+nei1lu+8jOS7hemcgOimgemhueebruW3suacieeahCBSZWFjdCAxOCsg5oiWIFZ1ZSAzLjMr44CCCgojIyDlhYjnlJ/miJDkuIDmrKHmnKzlnLDov5DooYzmqKHlnZcKCuWcqOacrOWMheagueebruW9lei/kOihjO+8iE5vZGUgMTgr77yJ77yaCgpgYGBzaApub2RlIHNjcmlwdHMvcHJlcGFyZS1ydW50aW1lLm1qcyAuLi9lbmVyZ3ktaWNvbnMtdjItY29tcGxldGUKYGBgCgrlj4LmlbDmjIflkJHml6flrozmlbTljIXop6PljovlkI7nmoTnm67lvZXvvIznm67lvZXkuIvlupTmnIkgYHNyYy9lbmdpbmUuanNgIOWSjCBgc3JjL2ljb25zLmpzYOOAguiEmuacrOivu+WPluW3suaciea6kOegge+8jOeUn+aIkCBgc3JjL3J1bnRpbWUuZ2VuZXJhdGVkLmpzYO+8jOayoeaciSBldmFs44CBQ0ROIOaIlui/kOihjOaXtue9kee7nOivt+axguOAguS4jeimgeaMh+WQkeKAnOS7heaWsOWinuS4pOaemuKAneeahOWwj+WMheOAggoK5oqK55Sf5oiQ5ZCO55qE5pW05LiqIGBzcmMvYCDmlL7ov5vnjrDmnInpobnnm67vvIzkvovlpoIgYHNyYy9jb21wb25lbnRzL2VuZXJneS1pY29ucy9g44CCUmVhY3Qg6aG555uu5Y+v5Yig6ZmkIGBFbmVyZ3lJY29uLnZ1ZWDvvJtWdWUg6aG555uu5Y+v5Yig6ZmkIFJlYWN0IOaWh+S7tuS4jiBgaW5kZXgudHNg44CCYHJ1bnRpbWUuZ2VuZXJhdGVkLmQudHNgIOaYr+i/kOihjOaooeWdl+eahCBUeXBlU2NyaXB0IOWjsOaYju+8jOmcgOS/neeVmeOAggoKIyMgUmVhY3QgLyBUU1gg55So5rOV77yINCDooYzvvIkKCmBgYHRzeAppbXBvcnQgeyBFbmVyZ3lJY29uIH0gZnJvbSAnLi9jb21wb25lbnRzL2VuZXJneS1pY29ucyc7CmV4cG9ydCBmdW5jdGlvbiBNZXRlckVudHJ5KCkgewogIHJldHVybiA8RW5lcmd5SWNvbiBuYW1lPSJtZXRlci1ib3giIHNpemU9ezI4fSBjb2xvcj0iIzIzNzREOSIgY2xhc3NOYW1lPSJtZXRlci1pY29uIiBhcmlhLWxhYmVsPSLooajnrrEiIC8+Owp9CmBgYAoK5qC45b+DIHByb3Bz77yaYG5hbWVgIOS4uuS4i+aWueWQjeensOiBlOWQiOexu+Wei++8m2BzaXplYCDkuLrmlbDlrZflg4/ntKDvvIzpu5jorqQgMjTvvJtgY29sb3JgIOS4uiBgI1JSR0dCQmDvvIzpu5jorqTnlLXnvZHok53vvJtgY2xhc3NOYW1lYCDnm7TmjqXkvZznlKjkuo7lpJblsYIgc3BhbuOAgui/mOaUr+aMgeW4uOeUqCBzcGFuIOWxnuaAp++8jOWmgiBgYXJpYS1sYWJlbG <section id="color"><h2>03 / 从一个主色派生</h2><p>默认主色为 #2374D9。本站深浅背景共用同一个强调色；渐变、描边、深色标记和投影由原始引擎派生。本站改色只需改内联 window.LIBRARY 的 accent（完整六位十六进制）。静态切图的颜色已固化，需要用原包导出脚本重新导出并同步数据。</p><pre class="code">// React / Vue：通过 color prop 设置
&lt;EnergyIcon name="wind-power" color="#2374D9" /&gt;
// 全局默认：接入包 src/controller.ts
const DEFAULT_ACCENT = '#2374D9';</pre><p>组件不接受 currentColor、CSS 变量字符串或三位颜色；先解析成 #RRGGBB 再传入。不要全局替换引擎参考色，也不要用 svg path 全局样式覆盖填充和线宽。</p></section>
<section id="naming"><h2>04 / 命名与扩展</h2><p>名称使用英文小写 kebab-case，按设备或用途命名，如 smart-meter、battery-energy-storage。保留现有 name 与文件名，中文业务名称放在 title 字段。</p><p>本站所有名字、分类、范围说明、推荐尺寸、资源路径与离线 SVG 集中在 <code>window.LIBRARY</code> 内联数据表。为已有引擎定义增添条目时只需添加这一条元数据，分类与数量自动计算。全新绘制的图标还需在 内联 ICONS 数组提供图形与动作定义，并添加相应 SVG 数据。</p><pre class="code">{ name: 'smart-meter', title: '智能电表',
  category: '用电计量', description: '读数屏变化…',
  object: '电子电能表', action: '液晶读数条向前更新',
  sizes: [24, 28], files: { rest: '…', hover: '…' },
  svg: { rest: '&lt;svg …&gt;…', hover: '&lt;svg …&gt;…' } }</pre><p>所有 SVG 已放在内联数据中，避免 file:// 下 fetch 的跨域限制；更新时保持静止态与结束态 SVG 同步。</p></section>
