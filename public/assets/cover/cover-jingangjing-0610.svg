  <text x="108" y="565" fill="#8B6A2B" font-family="Huiwen-mincho, Songti SC, serif" font-size="120" letter-spacing="4">金刚经的读后感悟</text>
  <text x="112" y="665" fill="#44403A" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="40" letter-spacing="12">应无所住，而生其心</text>
  <rect x="112" y="620" width="42" height="42" fill="none" stroke="#B14A37" stroke-width="4"/>
  <text x="121" y="647" fill="#B14A37" font-family="Songti SC, serif" font-size="16">读后</text>
  <text x="720" y="115" fill="#B8AA94" font-family="Songti SC, serif" font-size="28" writing-mode="tb" opacity=".5">须菩提。于意云何。可以身相见如来不。</text>
  <text x="800" y="95" fill="#B8AA94" font-family="Songti SC, serif" font-size="28" writing-mode="tb" opacity=".42">凡所有相。皆是虚妄。若见诸相非相。即见如来。</text>
  <text x="880" y="130" fill="#B8AA94" font-family="Songti SC, serif" font-size="28" writing-mode="tb" opacity=".38">应无所住而生其心。不应住色生心。</text>
